<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="IXVYN — Five intelligent systems.">

    <title>IXVYN — Systems</title>

    <!-- Leaflet.js Base Core Mapping Stylesheet Bundle -->
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <!-- Leaflet.js Core Canvas Spatial Script Module -->
    <script src="https://unpkg.com"></script>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="systems.css">

</head>


<body class="systems-page">


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="system-header">

        <a href="index.html"
           class="wordmark"
           aria-label="IXVYN home">

            I X V Y N

        </a>


        <nav class="system-nav">

            <a href="index.html#systems">
                Systems
            </a>

            <a href="index.html#about">
                About
            </a>

        </nav>


        <div class="system-status">

            <span class="status-dot"></span>

            SYSTEM ONLINE

        </div>

    </header>



    <!-- =================================================
         EXPERIENCE
    ================================================== -->

    <main class="system-experience">


        <!-- =================================================
             BACKGROUND GEOMETRY
        ================================================== -->

        <div class="experience-geometry"
             aria-hidden="true">

            <div class="geometry-ring ring-a"></div>
            <div class="geometry-ring ring-b"></div>
            <div class="geometry-ring ring-c"></div>

            <div class="geometry-diamond diamond-a"></div>
            <div class="geometry-diamond diamond-b"></div>

            <div class="geometry-axis axis-x"></div>
            <div class="geometry-axis axis-y"></div>

            <div class="geometry-node node-a"></div>
            <div class="geometry-node node-b"></div>
            <div class="geometry-node node-c"></div>

            <div class="experience-core">
                IX
            </div>

        </div>



        <!-- =================================================
             INTRO
        ================================================== -->

        <section class="system-intro">

            <p class="eyebrow">
                IXVYN / SYSTEM INTERFACE
            </p>

            <h1>
                CHOOSE
                <span>A DIRECTION.</span>
            </h1>

            <p class="intro-copy">
                Five intelligent systems.
                One human trajectory.
            </p>

        </section>



        <!-- =================================================
             EXIT
        ================================================== -->

        <a href="index.html"
           class="direction-exit"
           aria-label="Exit systems and return home">

            <span>
                EXIT
            </span>

            <span>
                ↖
            </span>

        </a><!-- =================================================
             MODULE SELECTOR
        ================================================== -->

        <section class="module-selector"
                 aria-label="IXVYN systems">


            <!-- =================================================
                 M01 — LENS
            ================================================== -->

            <button
                class="module-panel"
                data-system="lens"
                type="button">

                <span class="panel-number">
                    M01
                </span>

                <span class="panel-category">
                    DIAGNOSTIC
                </span>

                <span class="panel-title">
                    LENS
                </span>

                <span class="panel-description">
                    Discover the gaps between
                    what you know and what you need.
                </span>

                <span class="panel-action">
                    ENTER
                    <span>↗</span>
                </span>

            </button>



            <!-- =================================================
                 M02 — PATHFINDER
            ================================================== -->

            <button
                class="module-panel"
                data-system="pathfinder"
                type="button">

                <span class="panel-number">
                    M02
                </span>

                <span class="panel-category">
                    EXPLORATION
                </span>

                <span class="panel-title">
                    PATHFINDER
                </span>

                <span class="panel-description">
                    Explore possible futures through
                    experience, not prediction.
                </span>

                <span class="panel-action">
                    ENTER
                    <span>↗</span>
                </span>

            </button>


            <!-- =================================================
                 M03 — CIVIC
            ================================================== -->

            <button
                class="module-panel"
                data-system="civic"
                type="button">

                <span class="panel-number">
                    M03
                </span>

                <span class="panel-category">
                    DECODING
                </span>

                <span class="panel-title">
                    CIVIC
                </span>

                <span class="panel-description">
                    Transform complex public information
                    into something people can act upon.
                </span>

                <span class="panel-action">
                    ENTER
                    <span>↗</span>
                </span>

            </button>



            <!-- =================================================
                 M04 — ECHO
            ================================================== -->

            <button
                class="module-panel"
                data-system="echo"
                type="button">

                <span class="panel-number">
                    M04
                </span>

                <span class="panel-category">
                    ADAPTATION
                </span>

                <span class="panel-title">
                    ECHO
                </span>

                <span class="panel-description">
                    Shape information around the person,
                    not the other way around.
                </span>

                <span class="panel-action">
                    ENTER
                    <span>↗</span>
                </span>

            </button>



            <!-- =================================================
                 M05 — MEMORY
            ================================================== -->

            <button
                class="module-panel module-panel-wide"
                data-system="memory"
                type="button">

                <span class="panel-number">
                    M05
                </span>

                <span class="panel-category">
                    RETENTION
                </span>

                <span class="panel-title">
                    MEMORY
                </span>

                <span class="panel-description">
                    Understand what is fading before
                    it disappears — and bring it back.
                </span>

                <span class="panel-action">
                    ENTER
                    <span>↗</span>
                </span>

            </button>


        </section>



        <!-- =================================================
             ACTIVE SYSTEM OVERLAY
        ================================================== -->

        <section
            class="system-overlay"
            aria-hidden="true">


            <div class="overlay-geometry"
                 aria-hidden="true">

                <div class="overlay-ring overlay-ring-a"></div>
                <div class="overlay-ring overlay-ring-b"></div>
                <div class="overlay-ring overlay-ring-c"></div>

                <div class="overlay-diamond overlay-diamond-a"></div>
                <div class="overlay-diamond overlay-diamond-b"></div>

                <div class="overlay-scan"></div>

                <div class="overlay-core">
                    IX
                </div>

            </div>


            <div class="overlay-content">

                <span class="overlay-index">
                    IXVYN / ACTIVE
                </span>

                <span class="overlay-kicker">
                    SYSTEM
                </span>

                <h2 class="overlay-title">
                    LENS
                </h2>

                <p class="overlay-description">
                    Discover the gaps between
                    what you know and what you need.
                </p>

                <button
                    class="overlay-close"
                    type="button">

                    RETURN

                    <span>
                        ↙
                    </span>

                </button>

            </div>

        </section>



        <!-- =================================================
             FOOTER
        ================================================== -->

        <footer class="experience-footer">

            <span>
                IXVYN
            </span>

            <span>
                FIVE SYSTEMS / ONE INTELLIGENCE
            </span>

            <span>
                BUILD 001
            </span>

        </footer>


    </main>



    <!-- =================================================
         JAVASCRIPT
    ================================================== -->

    <script src="systems.js"></script>

</body>

</html>
